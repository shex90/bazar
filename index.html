<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مۆڵ و بازاڕێ ئۆنلاین</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- سەرێ ئەپی -->
    <header class="app-header">
        <div class="logo">
            <h2>بازاڕێ مە <span class="badge">Mall</span></h2>
        </div>
        <div class="header-actions">
            <!-- دوگمەیا هەژمارێ دگەل وێنەیێ پرۆفایلی -->
            <button id="userProfileBtn" class="btn-profile">
                <img id="headerUserAvatar" src="" style="display: none;" class="header-avatar" alt="پرۆفایل">
                <i id="headerUserIcon" class="fa-solid fa-user"></i>
                <span id="userProfileText">هەژمار</span>
            </button>
            <button id="adminToggleBtn" class="btn-admin" title="دۆخێ ئەدمینی">
                <i class="fa-solid fa-user-shield"></i> ئەدمین
            </button>
            <button id="openAddModalBtn" class="btn-add">
                <i class="fa-solid fa-plus"></i> زێدەکرن
            </button>
        </div>
    </header>

    <!-- بانەرا کرێکرنا دوکانێ -->
    <section class="rent-banner">
        <div class="banner-text">
            <h4><i class="fa-solid fa-shop"></i> تە دڤێت کەلپەلێن خۆ بفرۆشی؟</h4>
            <p>دوکانا خۆ د ئەپی دا کرێ بکە و بەرهەمێن خۆ ڕاستەوخۆ نیشانی کڕیاران بدە.</p>
        </div>
        <a id="rentShopBtn" href="#" target="_blank" class="btn-rent">
            <i class="fa-brands fa-whatsapp"></i> کرێکرنا دوکانێ
        </a>
    </section>

    <!-- بەشێ فلتەران -->
    <section class="controls">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ل چ بەرهەمی یان دوکانەکێ دگەڕی؟">
        </div>

        <div class="filter-section-title">دوکانێن پشکدار:</div>
        <div class="store-tabs" id="storeTabs">
            <button class="store-btn active" data-store="all">هەمی دوکان</button>
        </div>

        <div class="filter-section-title" style="margin-top: 10px;">جۆرێ بەرهەمی:</div>
        <div class="category-tabs">
            <button class="cat-btn active" data-category="all">هەمی</button>
            <button class="cat-btn" data-category="clothes">جلوبەرگ</button>
            <button class="cat-btn" data-category="shoes">پێلاڤ</button>
            <button class="cat-btn" data-category="electronics">ئەلکترۆنیات</button>
            <button class="cat-btn" data-category="other">یێن دی</button>
        </div>
    </section>

    <!-- جهێ بەرهەمان -->
    <main class="products-container" id="productsGrid"></main>

    <!-- مۆداڵا پرۆفایل و هەژمارێ (Profile Modal) -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <span class="close-btn" id="closeProfileModalBtn">&times;</span>
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img id="profileAvatarPreview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="Avatar">
                    <label for="profileImageInput" class="avatar-edit-badge" title="گۆڕینا وێنەی">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="profileImageInput" accept="image/*" style="display: none;">
                </div>
                <h3 style="margin-top: 10px;">پرۆفایلێ من</h3>
                <p style="font-size: 12px; color: #64748b;">زانیاریێن خۆ بنڤیسە دا ئەکاونتێ تە دروست ببیت</p>
            </div>

            <form id="profileForm">
                <label>ناڤێ تە یێ تەواو:</label>
                <input type="text" id="profName" placeholder="بۆ نموونە: ڕەمەزان حسێن" required>

                <label>ئیمەیل (Email):</label>
                <input type="email" id="profEmail" placeholder="name@example.com" required>

                <label>ژمارەیا مۆبایلێ (WhatsApp):</label>
                <input type="tel" id="profPhone" placeholder="0750xxxxxxx" required>

                <label>باژێڕ / دەڤەر:</label>
                <input type="text" id="profCity" placeholder="دهۆک، زاخۆ..." required>

                <label>ناڤنیشانێ گەیاندنێ (تاخ، کووچە):</label>
                <textarea id="profAddress" rows="2" placeholder="تاخێ مالتا، جاددەیا سەرەکی..." required></textarea>

                <button type="submit" class="btn-save-profile">
                    <i class="fa-solid fa-floppy-disk"></i> پاشەکەوتکرنا هەژمارێ
                </button>
            </form>
        </div>
    </div>

    <!-- مۆداڵا کڕین و داواکرنێ -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-btn" id="closeOrderModalBtn">&times;</span>
            <div class="order-header">
                <i class="fa-solid fa-truck-fast"></i>
                <h3>زانیاریێن گەیاندن و کڕینێ</h3>
            </div>
            
            <div class="product-summary" id="orderProductSummary"></div>

            <form id="orderForm">
                <label>ناڤێ کڕیاری:</label>
                <input type="text" id="custName" required>

                <label>ژمارەیا مۆبایلێ:</label>
                <input type="tel" id="custPhone" required>

                <label>باژێڕ:</label>
                <input type="text" id="custCity" required>

                <label>ناڤنیشانێ گەیاندنێ:</label>
                <textarea id="custAddress" rows="2" required></textarea>

                <button type="submit" class="btn-confirm-order">
                    <i class="fa-brands fa-whatsapp"></i> داواکرن ب WhatsApp
                </button>
            </form>
        </div>
    </div>

    <!-- مۆداڵا زێدەکرنا کاڵایێ نوی -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h3>زێدەکرنا کاڵایێ نوی</h3>
            <form id="productForm">
                <label>ناڤێ دوکانا تە:</label>
                <input type="text" id="prodStore" placeholder="بۆ نموونە: بۆتیکا زارا..." required>

                <label>ناڤێ بەرهەمی:</label>
                <input type="text" id="prodTitle" placeholder="چاکێت، پێلاڤ..." required>

                <label>پۆلێن:</label>
                <select id="prodCategory" required>
                    <option value="clothes">جلوبەرگ</option>
                    <option value="shoes">پێلاڤ</option>
                    <option value="electronics">ئەلکترۆنیات</option>
                    <option value="other">یێن دی</option>
                </select>

                <label>نرخ:</label>
                <input type="text" id="prodPrice" placeholder="25,000 دینار" required>

                <label>وێنەیێ بەرهەمی:</label>
                <input type="file" id="prodImageFile" accept="image/*" required>
                <div id="imagePreviewContainer" style="display: none; margin-top: 8px;">
                    <img id="imagePreview" src="" alt="پێشبینی" style="width: 100%; height: 140px; object-fit: cover; border-radius: 8px;">
                </div>

                <label>ژمارەیا WhatsApp یا دوکاندارێ:</label>
                <input type="tel" id="prodPhone" placeholder="964750xxxxxxx" required>

                <label>شار / جهێ دوکانێ:</label>
                <input type="text" id="prodCity" placeholder="دهۆک، زاخۆ..." required>

                <button type="submit" class="btn-submit">بەلاڤکرنا بەرهەمی</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
