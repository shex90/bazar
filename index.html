<!DOCTYPE html>
<html lang="ku" dir="rtl" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title id="pageTitle">مۆڵ و بازاڕێ ئۆنلاین</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- سەرێ ئەپی -->
    <header class="app-header">
        <div class="logo">
            <h2 id="txtLogo">بازاڕێ مە <span class="badge">Mall</span></h2>
        </div>
        <div class="header-actions">
            <!-- دوگمەیا هەلبژارتنا زمانی ب دەست لێدانا ئێکسەر -->
            <select id="langSelect" class="lang-dropdown">
                <option value="badini">بادینی</option>
                <option value="sorani">سۆرانی</option>
                <option value="ar">عربي</option>
                <option value="en">English</option>
            </select>

            <!-- سەلک -->
            <button id="openCartBtn" class="btn-cart" title="Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCountBadge" class="cart-badge">0</span>
            </button>

            <!-- هەژمار -->
            <button id="userProfileBtn" class="btn-profile">
                <img id="headerUserAvatar" src="" style="display: none;" class="header-avatar" alt="Avatar">
                <i id="headerUserIcon" class="fa-solid fa-user"></i>
                <span id="userProfileText">هەژمار</span>
            </button>

            <!-- ئەدمین -->
            <button id="adminToggleBtn" class="btn-admin" title="Admin">
                <i class="fa-solid fa-user-shield"></i>
            </button>

            <!-- زێدەکرن -->
            <button id="openAddModalBtn" class="btn-add" title="Add">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </header>

    <!-- بانەرا کرێکرنا دوکانێ -->
    <section class="rent-banner">
        <div class="banner-text">
            <h4 id="txtBannerTitle"><i class="fa-solid fa-shop"></i> تە دڤێت کەلپەلێن خۆ بفرۆشی؟</h4>
            <p id="txtBannerDesc">دوکانا خۆ نوکە د ئەپی دا کرێ بکە و بەرهەمێن خۆ نیشانی هەزاران کڕیاران بدە.</p>
        </div>
        <a id="rentShopBtn" href="#" target="_blank" class="btn-rent">
            <i class="fa-brands fa-whatsapp"></i> <span id="txtRentBtn">کرێکرنا دوکانێ</span>
        </a>
    </section>

    <!-- کۆنترۆڵ و فلتەر -->
    <section class="controls">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ل چ بەرهەمی یان دوکانەکێ دگەڕی؟">
        </div>

        <div class="filter-section-title" id="txtStoresTitle">دوکانێن پشکدار:</div>
        <div class="store-tabs" id="storeTabs">
            <button class="store-btn active" data-store="all" id="btnAllStores">هەمی دوکان</button>
        </div>

        <div class="filter-section-title" id="txtCategoriesTitle" style="margin-top: 10px;">جۆرێ بەرهەمی:</div>
        <div class="category-tabs">
            <button class="cat-btn active" data-category="all" id="catAll">هەمی</button>
            <button class="cat-btn" data-category="clothes" id="catClothes">جلوبەرگ</button>
            <button class="cat-btn" data-category="shoes" id="catShoes">پێلاڤ</button>
            <button class="cat-btn" data-category="electronics" id="catElectronics">ئەلکترۆنیات</button>
            <button class="cat-btn" data-category="other" id="catOther">یێن دی</button>
        </div>
    </section>

    <!-- بەرهەم -->
    <main class="products-container" id="productsGrid"></main>

    <!-- مۆداڵا سەلکێ -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" id="closeCartModalBtn">&times;</span>
            <div class="cart-header">
                <i class="fa-solid fa-basket-shopping"></i>
                <h3 id="txtCartTitle">سەلکا کڕینێ یا تە</h3>
            </div>
            
            <div id="cartItemsList" class="cart-items-list"></div>

            <div class="cart-footer" id="cartFooterSection" style="display: none;">
                <div class="cart-total-box">
                    <span id="txtTotalCountLabel">کۆمێ گشتی:</span>
                    <strong id="cartTotalItemsCount">0</strong>
                </div>
                <button id="checkoutCartBtn" class="btn-confirm-order">
                    <i class="fa-brands fa-whatsapp"></i> <span id="txtOrderAllBtn">داواکرنا هەمییان ب WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- مۆداڵا ناڤنیشان و کڕینێ -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-btn" id="closeOrderModalBtn">&times;</span>
            <div class="order-header">
                <i class="fa-solid fa-truck-fast"></i>
                <h3 id="txtOrderHeaderTitle">زانیاریێن گەیاندن و کڕینێ</h3>
            </div>
            
            <div class="product-summary" id="orderProductSummary"></div>

            <form id="orderForm">
                <label id="lblCustName">ناڤێ کڕیاری:</label>
                <input type="text" id="custName" required>

                <label id="lblCustPhone">ژمارەیا تەلەفۆنێ (WhatsApp):</label>
                <input type="tel" id="custPhone" required>

                <label id="lblCustCity">باژێڕ / دەڤەر:</label>
                <input type="text" id="custCity" required>

                <label id="lblCustAddress">ناڤنیشانێ گەیاندنێ:</label>
                <textarea id="custAddress" rows="2" required></textarea>

                <button type="submit" class="btn-confirm-order">
                    <i class="fa-brands fa-whatsapp"></i> <span id="txtSendOrderBtn">ناردنا داواکاریێ ب WhatsApp</span>
                </button>
            </form>
        </div>
    </div>

    <!-- مۆداڵا پرۆفایلێ -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <span class="close-btn" id="closeProfileModalBtn">&times;</span>
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img id="profileAvatarPreview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200" alt="Avatar">
                    <label for="profileImageInput" class="avatar-edit-badge" title="گۆڕینا وێنەی">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="profileImageInput" accept="image/*" style="display: none;">
                </div>
                <h3 id="txtProfileTitle" style="margin-top: 10px;">پرۆفایلێ من</h3>
            </div>

            <form id="profileForm">
                <label id="lblProfName">ناڤێ تە یێ تەواو:</label>
                <input type="text" id="profName" required>

                <label id="lblProfEmail">ئیمەیل (Email):</label>
                <input type="email" id="profEmail" required>

                <label id="lblProfPhone">ژمارەیا مۆبایلێ:</label>
                <input type="tel" id="profPhone" required>

                <label id="lblProfCity">شار:</label>
                <input type="text" id="profCity" required>

                <label id="lblProfAddress">ناڤنیشان:</label>
                <textarea id="profAddress" rows="2" required></textarea>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-floppy-disk"></i> <span id="txtSaveProfileBtn">پاشەکەوتکرن</span>
                </button>
            </form>
        </div>
    </div>

    <!-- مۆداڵا زێدەکرنا کاڵایێ نوی -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h3 id="txtAddModalTitle">زێدەکرنا کاڵایێ نوی</h3>
            <form id="productForm">
                <label id="lblProdStore">ناڤێ دوکانا تە:</label>
                <input type="text" id="prodStore" required>

                <label id="lblProdTitle">ناڤێ بەرهەمی:</label>
                <input type="text" id="prodTitle" required>

                <label id="lblProdCat">پۆلێن:</label>
                <select id="prodCategory" required>
                    <option value="clothes" id="optClothes">جلوبەرگ</option>
                    <option value="shoes" id="optShoes">پێلاڤ</option>
                    <option value="electronics" id="optElectronics">ئەلکترۆنیات</option>
                    <option value="other" id="optOther">یێن دی</option>
                </select>

                <label id="lblProdPrice">نرخ:</label>
                <input type="text" id="prodPrice" required>

                <label id="lblProdImage">وێنەیێ بەرهەمی:</label>
                <input type="file" id="prodImageFile" accept="image/*" required>
                <div id="imagePreviewContainer" style="display: none; margin-top: 8px;">
                    <img id="imagePreview" src="" alt="Preview" style="width: 100%; height: 140px; object-fit: cover; border-radius: 8px;">
                </div>

                <label id="lblProdPhone">ژمارەیا WhatsApp یا دوکاندارێ:</label>
                <input type="tel" id="prodPhone" required>

                <label id="lblProdCity">شار / جهێ دوکانێ:</label>
                <input type="text" id="prodCity" required>

                <button type="submit" class="btn-submit">
                    <span id="txtPublishBtn">بەلاڤکرنا بەرهەمی</span>
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
